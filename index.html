<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT Ops Dashboard</title>
<meta name="description" content="Daily MT Ops Register &amp; Dashboard — static, Excel-backed.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23141414' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 17h14M5 17a2 2 0 1 0 0-4M5 17V9l2-5h10l2 5v8m0 0a2 2 0 1 0 0-4M6 12h12'/%3E%3Ccircle cx='7' cy='17' r='2'/%3E%3Ccircle cx='17' cy='17' r='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============================= LOGIN SCREEN ============================= -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="login-icon-holder"></div>
    <h1>MT Ops</h1>
    <p class="sub">Daily Register — Sign in to continue</p>
    <form id="login-form">
      <div class="field">
        <label>Username</label>
        <div class="input-icon" id="login-user-icon">
          <input type="text" id="login-username" autocomplete="username" placeholder="Username">
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-icon" id="login-pass-icon">
          <input type="password" id="login-password" autocomplete="current-password" placeholder="Password">
        </div>
      </div>
      <div id="login-error" class="error-text" hidden style="margin-bottom:12px"></div>
      <button class="btn btn-primary btn-block" id="login-submit" type="submit">Login</button>
    </form>
    <p class="hint">Operators sign in with their <strong>Force No.</strong> — contact the MT admin if you cannot log in.</p>
  </div>
</div>

<!-- ============================== APP SHELL ================================ -->
<div id="app-shell" hidden></div>

<div id="toast-stack"></div>

<!-- Vendored locally (js/vendor) on purpose: GitHub Pages sites are often opened
     from restricted office networks, so the app must not depend on a CDN
     being reachable. See js/vendor/README.md for versions & licenses. -->
<script type="module" src="js/firebase-init.js"></script>
<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="js/vendor/html2canvas.min.js"></script>

<script src="js/icons.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/charts.js"></script>
<script src="js/pages.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('login-icon-holder').innerHTML = icon('car');
  document.getElementById('login-user-icon').insertAdjacentHTML('afterbegin', icon('user'));
  document.getElementById('login-pass-icon').insertAdjacentHTML('afterbegin', icon('key'));
</script>
</body>
</html>
